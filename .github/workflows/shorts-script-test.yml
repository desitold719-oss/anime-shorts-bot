name: Shorts Script Test (Phase 2 - Gemini)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate 5 Hindi fact scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/script-test.mjs

      - name: Upload scripts artifact
        uses: actions/upload-artifact@v4
        with:
          name: script-test-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: error
